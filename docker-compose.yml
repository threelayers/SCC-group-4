services:
  dashboard:
    build: .
    environment:
      PORT: "5000"
      HOST: "0.0.0.0"
      FLASK_DEBUG: "0"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./dependencies.json:/app/dependencies.json:ro

  daily-collector:
    build: .
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
    command:
      - sh
      - -c
      - |
        while true; do
          python main.py --days 1 --commit-days 1 --commit-limit 20
          sleep 86400
        done
    volumes:
      - ./data:/app/data
      - ./dependencies.json:/app/dependencies.json:ro
    profiles:
      - scheduler
